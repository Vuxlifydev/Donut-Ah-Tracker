<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Donut SMP | Professional Stats</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <header>
            <div class="logo">🍩 DONUT STATS <span class="badge">PRO</span></div>
            <nav>
                <button onclick="showSection('auction')">Auction</button>
                <button onclick="showSection('leaderboards')">Leaderboards</button>
            </nav>
        </header>

        <section class="hero-stats">
            <div class="stat-card">
                <span class="label">SERVER STATUS</span>
                <div class="value online" id="server-status">ONLINE</div>
            </div>
            <div class="stat-card">
                <span class="label">PLAYERS ONLINE</span>
                <div class="value" id="player-count">...</div>
            </div>
            <div class="stat-card">
                <span class="label">VERSION</span>
                <div class="value">1.21.11</div>
            </div>
        </section>

        <main id="main-content">
            <div class="card-large">
                <h3>LIVE AUCTION TRANSACTIONS</h3>
                <table>
                    <thead>
                        <tr><th>ITEM</th><th>PRICE</th><th>BUYER</th></tr>
                    </thead>
                    <tbody id="live-table"></tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
